name: Archive Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FrostWyrm-Archive.slnx

      - name: Build
        run: dotnet build FrostWyrm-Archive.slnx --no-restore

      - name: Test
        run: dotnet test FrostWyrm-Archive.slnx --no-build --no-restore --verbosity normal
